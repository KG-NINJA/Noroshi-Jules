<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - KGNINJA Knowledge Base</title>
    <meta name="description" content="{{ description }}">
    <meta name="keywords" content="{{ keywords | join(', ') }}">

    <!-- AI/Search Engine Optimization: Structured Data -->
    <script type="application/ld+json">
    {{ entity_data | tojson(indent=4) }}
    </script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; color: #333; }
        header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { font-size: 2.5em; margin-bottom: 0.5em; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .tag { background: #eee; padding: 3px 8px; border-radius: 4px; margin-right: 5px; }
        article { font-size: 1.2em; }
        footer { margin-top: 50px; border-top: 1px solid #ccc; padding-top: 20px; font-size: 0.8em; color: #666; }
    </style>
</head>
<body>
    <header>
        <p><strong>KGNINJA</strong> AI Knowledge Spread System</p>
    </header>

    <main>
        <article>
            <header>
                <h1>{{ title }}</h1>
                <div class="meta">
                    Published on <time datetime="{{ date }}">{{ date }}</time>
                    <br>
                    Topic: {{ topic }}
                </div>
            </header>

            <div class="content">
                {{ body }}
            </div>

            <div class="tags" style="margin-top: 2rem;">
                <strong>Keywords:</strong>
                {% for tag in keywords %}
                <span class="tag">{{ tag }}</span>
                {% endfor %}
            </div>
        </article>
    </main>

    <footer>
        <p>Generated by KGNINJA Auto-Spreader System. Optimized for AI Indexing.</p>
        <p><a href="index.html">Back to Archive</a></p>
    </footer>
</body>
</html>
